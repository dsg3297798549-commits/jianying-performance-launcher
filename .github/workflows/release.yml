name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v2.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build Windows executable
        shell: pwsh
        run: .\build.ps1

      - name: Add SHA-256 to release notes
        shell: pwsh
        run: |
          $hash = (Get-FileHash '.\dist\剪映性能启动器.exe' -Algorithm SHA256).Hash
          Add-Content -Path RELEASE_NOTES.md -Value "`n## 下载文件 SHA-256`n`n``$hash``"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          gh release create "$tag" ".\dist\剪映性能启动器.exe#剪映性能启动器.exe" --title "剪映性能启动器 $tag" --notes-file RELEASE_NOTES.md
